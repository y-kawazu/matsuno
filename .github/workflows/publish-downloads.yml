name: Publish downloadable materials

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: matsuno-pages-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source files
        uses: actions/checkout@v4
        with:
          ref: main
          path: source

      - name: Check out published site
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: public
          fetch-depth: 0

      - name: Refresh public blog data
        run: python3 source/scripts/sync_blog.py

      - name: Publish site without unprotected document copies
        run: |
          rsync -ac --delete --exclude '.git' --exclude '.github' --exclude 'admin-downloads' --exclude 'assets/downloads' source/ public/
          rm -rf public/assets/downloads
          git -C public config user.name 'github-actions[bot]'
          git -C public config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C public add -A
          git -C public diff --cached --quiet || git -C public commit -m 'Publish downloadable materials'
          git -C public push origin gh-pages

      - name: Request GitHub Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/${{ github.repository }}/pages/builds
